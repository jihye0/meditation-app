<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고요 — 명상 타이머</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#10131f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10131f;
    --accent: #a8d8c8;
    --accent2: #c4a8e8;
    --gold: #e8d5a8;
    --text: #eef1f6;
    --muted: #8b94a8;
    --glass: rgba(255,255,255,0.055);
    --glass-border: rgba(255,255,255,0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Gowun Dodum', -apple-system, 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 60px;
    overflow-x: hidden;
  }
  /* --- 오로라 배경 --- */
  .aurora { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
  .aurora span {
    position: absolute; border-radius: 50%;
    filter: blur(90px); opacity: 0.35;
  }
  .aurora span:nth-child(1) {
    width: 60vmax; height: 60vmax; left: -15vmax; top: -20vmax;
    background: #2a4a5e; animation: drift1 26s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(2) {
    width: 50vmax; height: 50vmax; right: -18vmax; top: 15vh;
    background: #3d2e5c; animation: drift2 32s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(3) {
    width: 45vmax; height: 45vmax; left: 10vw; bottom: -25vmax;
    background: #1e4a40; animation: drift3 28s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(12vw, 10vh) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-10vw, 14vh) scale(0.9); } }
  @keyframes drift3 { to { transform: translate(8vw, -12vh) scale(1.2); } }
  /* --- 별 --- */
  .stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  .stars i {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; opacity: 0.5;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: 0.12; } 50% { opacity: 0.7; } }

  h1 {
    font-family: 'Gowun Batang', serif;
    font-weight: 400; letter-spacing: 18px; text-indent: 18px;
    font-size: 36px; margin-bottom: 10px;
    background: linear-gradient(120deg, var(--accent), var(--accent2), var(--gold));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub { color: var(--muted); margin-bottom: 44px; font-size: 13.5px; letter-spacing: 3px; }

  .section-label {
    color: var(--muted); font-size: 12px; margin: 30px 0 14px;
    letter-spacing: 5px; text-indent: 5px;
  }
  .chips { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; max-width: 460px; }
  .chip {
    padding: 10px 19px;
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    background: var(--glass);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: var(--text);
    cursor: pointer;
    font-size: 14.5px;
    font-family: inherit;
    transition: all 0.3s cubic-bezier(.4,0,.2,1);
  }
  .chip:hover { background: rgba(255,255,255,0.11); transform: translateY(-2px); }
  .chip.active {
    background: linear-gradient(135deg, var(--accent), #7fb8a4);
    color: #10131f; border-color: transparent; font-weight: 700;
    box-shadow: 0 4px 24px rgba(168,216,200,0.35);
  }

  /* --- 진행 링 --- */
  .ring {
    width: 300px; height: 300px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 50%; position: relative; margin: 40px 0 8px;
  }
  .ring::before {
    content: ''; position: absolute; inset: 18px; border-radius: 50%;
    background: radial-gradient(circle, rgba(168,216,200,0.07), transparent 70%);
  }
  .ring svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
  .timer-display {
    font-size: 60px; font-weight: 300;
    font-variant-numeric: tabular-nums; letter-spacing: 3px;
    font-family: 'Gowun Batang', serif;
    text-shadow: 0 0 40px rgba(168,216,200,0.3);
  }
  .status { color: var(--muted); font-size: 13.5px; margin-top: 8px; letter-spacing: 2px; }
  body.playing .ring { animation: ringbreathe 8s ease-in-out infinite; }
  @keyframes ringbreathe { 0%,100% { transform: scale(0.985); } 50% { transform: scale(1.015); } }

  .controls { display: flex; gap: 14px; margin-top: 28px; }
  .btn {
    padding: 15px 48px; border-radius: 34px; border: none;
    font-size: 16.5px; cursor: pointer; font-family: inherit;
    background: linear-gradient(135deg, var(--accent), #86bda9);
    color: #10131f; font-weight: 700; letter-spacing: 2px;
    box-shadow: 0 6px 28px rgba(168,216,200,0.3);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 10px 36px rgba(168,216,200,0.45); }
  .btn:active { transform: scale(0.97); }
  .btn.secondary {
    background: var(--glass); color: var(--muted);
    border: 1px solid var(--glass-border); box-shadow: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }

  .volume-wrap {
    display: flex; align-items: center; gap: 12px; margin-top: 30px;
    color: var(--muted); font-size: 14px;
    padding: 12px 22px; border-radius: 30px;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  input[type=range] { accent-color: var(--accent); width: 150px; }

  /* --- 기록 --- */
  .stats { display: flex; gap: 12px; margin-top: 14px; width: 100%; max-width: 440px; }
  .stat-card {
    flex: 1; text-align: center; padding: 20px 8px 16px;
    background: var(--glass); border-radius: 20px;
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: transform 0.25s;
  }
  .stat-card:hover { transform: translateY(-3px); }
  .stat-card .num {
    font-size: 30px; font-weight: 400; font-family: 'Gowun Batang', serif;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-card .label { font-size: 11.5px; color: var(--muted); margin-top: 6px; letter-spacing: 1px; }
  .history { width: 100%; max-width: 440px; margin-top: 14px; }
  .history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; border-radius: 16px; margin-bottom: 9px;
    background: var(--glass); border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: 14px;
  }
  .history-item .when { color: var(--muted); font-size: 12px; }
  .empty-history { text-align: center; color: var(--muted); font-size: 13px; padding: 20px; }

  .quote {
    margin-top: 48px; color: var(--muted); font-size: 13px;
    font-family: 'Gowun Batang', serif; font-style: normal;
    text-align: center; max-width: 320px; line-height: 1.9; opacity: 0.8;
  }
</style>
</head>
<body>
<div class="aurora"><span></span><span></span><span></span></div>
<div class="stars" id="stars"></div>

<h1>고요</h1>
<div class="sub">잠시, 숨을 고르는 시간</div>

<div class="section-label">시간</div>
<div class="chips" id="timeChips">
  <button class="chip" data-min="5">5분</button>
  <button class="chip active" data-min="10">10분</button>
  <button class="chip" data-min="15">15분</button>
  <button class="chip" data-min="20">20분</button>
  <button class="chip" data-min="30">30분</button>
  <button class="chip" data-min="60">60분</button>
</div>

<div class="section-label">사운드</div>
<div class="chips" id="soundChips">
  <button class="chip active" data-sound="rain">🌧️ 빗소리</button>
  <button class="chip" data-sound="ocean">🌊 파도</button>
  <button class="chip" data-sound="wind">🍃 바람</button>
  <button class="chip" data-sound="bowl">🔔 싱잉볼</button>
  <button class="chip" data-sound="drone">🕉️ 옴 드론</button>
  <button class="chip" data-sound="piano">🎹 짐노페디</button>
</div>

<div class="ring">
  <svg width="300" height="300">
    <defs>
      <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a8d8c8"/>
        <stop offset="55%" stop-color="#c4a8e8"/>
        <stop offset="100%" stop-color="#e8d5a8"/>
      </linearGradient>
    </defs>
    <circle cx="150" cy="150" r="138" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="5"/>
    <circle id="progress" cx="150" cy="150" r="138" fill="none" stroke="url(#ringGrad)" stroke-width="5"
      stroke-linecap="round" stroke-dasharray="867.1" stroke-dashoffset="867.1"
      style="transition: stroke-dashoffset 1s linear"/>
  </svg>
  <div class="timer-display" id="display">10:00</div>
  <div class="status" id="status">준비됨</div>
</div>

<div class="controls">
  <button class="btn" id="startBtn">시작</button>
  <button class="btn secondary" id="resetBtn">초기화</button>
</div>

<div class="volume-wrap">
  🔈 <input type="range" id="volume" min="0" max="100" value="50"> 🔊
</div>

<div class="section-label" style="margin-top:48px">나의 기록</div>
<div class="stats">
  <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">총 명상 (분)</div></div>
  <div class="stat-card"><div class="num" id="statCount">0</div><div class="label">완료 횟수</div></div>
  <div class="stat-card"><div class="num" id="statStreak">0</div><div class="label">연속 일수 🔥</div></div>
</div>
<div class="history" id="historyList"></div>

<div class="quote" id="quote"></div>

<script>
let ctx = null, masterGain = null, nodes = [], bowlTimer = null;
let totalSec = 600, remainSec = 600, tickInterval = null, running = false;
const CIRC = 867.1;

const $ = id => document.getElementById(id);

// --- 별 흩뿌리기 ---
(function () {
  const wrap = $('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = Math.random() * 4 + 's';
    s.style.animationDuration = 3 + Math.random() * 4 + 's';
    wrap.appendChild(s);
  }
})();

// --- 오늘의 한 줄 ---
const quotes = [
  '“숨을 들이쉬며 마음을 고요히 하고,\n숨을 내쉬며 미소 짓는다.” — 틱낫한',
  '“현재 이 순간이 우리가 가진 전부다.”',
  '“고요함 속에서 비로소 자신을 만난다.”',
  '“천천히 가도 괜찮다. 멈추지만 않는다면.”',
  '“마음이 잔잔해지면, 길이 보인다.”'
];
$('quote').textContent = quotes[new Date().getDate() % quotes.length];

// --- 사운드 합성 ---
// 찌그러짐(클리핑) 없이 정규화하고, 끝과 시작을 크로스페이드해
// 반복될 때 이음매가 안 들리도록(뚝뚝 끊김 방지) 만든다.
function makeNoiseBuffer(c, kind) {
  const sr = c.sampleRate;
  const len = sr * 6;            // 6초 루프
  const fade = Math.floor(sr * 0.8); // 0.8초 크로스페이드
  const total = len + fade;
  const raw = new Float32Array(total);
  if (kind === 'white') {
    for (let i = 0; i < total; i++) raw[i] = Math.random() * 2 - 1;
  } else {
    // 새는 적분기(leaky integrator) — 값이 발산하지 않아 클리핑이 안 생김
    let last = 0;
    for (let i = 0; i < total; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      raw[i] = last;
    }
  }
  // 정규화: 최댓값을 0.6으로 맞춰 일정한 음량 + 여유
  let max = 1e-6;
  for (let i = 0; i < total; i++) { const a = Math.abs(raw[i]); if (a > max) max = a; }
  const norm = 0.6 / max;
  for (let i = 0; i < total; i++) raw[i] *= norm;
  // 끝부분(len~total)을 앞부분에 겹쳐 매끄럽게 이어지게
  const buf = c.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = raw[i];
  for (let i = 0; i < fade; i++) {
    const t = i / fade;
    d[i] = raw[i] * t + raw[len + i] * (1 - t);
  }
  return buf;
}

// --- 피아노 음 합성 ---
const SEMI = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
function freqOf(name) {
  const m = name.match(/^([A-G]#?)(\d)$/);
  const midi = SEMI[m[1]] + (parseInt(m[2]) + 1) * 12;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function pianoNote(f, t, dur, vel) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vel, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 2600;
  g.connect(lp); lp.connect(masterGain);
  [[1, 1], [2, 0.28], [3, 0.1]].forEach(([mult, amp]) => {
    const o = ctx.createOscillator();
    o.type = 'triangle'; o.frequency.value = f * mult;
    const og = ctx.createGain(); og.gain.value = amp;
    o.connect(og); og.connect(g);
    o.start(t); o.stop(t + dur + 0.1);
  });
}
function playChord(names, t, dur, vel) { names.forEach(n => pianoNote(freqOf(n), t, dur, vel)); }

// 짐노페디 1번 (사티) — 잔잔하게 편곡한 8마디 루프
function startGymnopedie() {
  const beat = 1.15;            // 한 박 (느리게)
  const M = beat * 3;           // 한 마디(3박)
  // 반주: A=Gmaj7, B=Dmaj7 두 마디를 번갈아
  const bassA = 'G2', chordA = ['B3', 'D4', 'F#4'];
  const bassB = 'D2', chordB = ['A3', 'C#4', 'F#4'];
  // 멜로디 [마디번호(0~), 박, 음, 길이(박)]
  const melody = [
    [2, 0, 'F#5', 3],
    [3, 0, 'C#6', 2], [3, 2, 'B5', 1],
    [4, 0, 'A5', 1], [4, 1, 'G5', 1], [4, 2, 'F#5', 1],
    [5, 0, 'E5', 3],
    [6, 0, 'F#5', 1], [6, 1, 'E5', 1], [6, 2, 'D5', 1],
    [7, 0, 'C#5', 3]
  ];
  const loopLen = 8 * M;
  const schedule = (t0) => {
    if (!running) return;
    for (let m = 0; m < 8; m++) {
      const mt = t0 + m * M;
      const isA = m % 2 === 0;
      pianoNote(freqOf(isA ? bassA : bassB), mt, M * 1.05, 0.22);
      playChord(isA ? chordA : chordB, mt + beat, beat * 1.9, 0.11);
      playChord(isA ? chordA : chordB, mt + beat * 2, beat * 1.0, 0.09);
    }
    melody.forEach(([m, b, n, len]) => pianoNote(freqOf(n), t0 + m * M + b * beat, len * beat * 1.05, 0.2));
    bowlTimer = setTimeout(() => schedule(ctx.currentTime + 0.05), loopLen * 1000);
  };
  schedule(ctx.currentTime + 0.3);
}

// 아이폰 무음 모드에서도 소리가 나도록, 무음 오디오 태그를 먼저 재생해
// 오디오 세션을 미디어 재생 모드로 전환한다
let silentEl = null;
function unlockIOSAudio() {
  if (!silentEl) {
    silentEl = document.createElement('audio');
    silentEl.setAttribute('playsinline', '');
    silentEl.loop = true;
    // 아주 짧은 무음 wav (base64)
    silentEl.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAACAgICA';
  }
  silentEl.play().catch(() => {});
}

function startSound(type) {
  unlockIOSAudio();
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  masterGain = ctx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(ctx.destination);
  masterGain.gain.linearRampToValueAtTime($('volume').value / 100, ctx.currentTime + 3);

  if (type === 'rain') {
    // 층1: 부드러운 '쏴아' 빗줄기 — 백색소음을 로우패스로 깎아 날카로움 제거
    const src = ctx.createBufferSource();
    src.buffer = makeNoiseBuffer(ctx, 'white');
    src.loop = true;
    const lp1 = ctx.createBiquadFilter();
    lp1.type = 'lowpass'; lp1.frequency.value = 1800; lp1.Q.value = 0.5;
    const hp1 = ctx.createBiquadFilter();
    hp1.type = 'highpass'; hp1.frequency.value = 300; // 웅웅거림 제거
    const rainGain = ctx.createGain(); rainGain.gain.value = 0.45;
    src.connect(hp1); hp1.connect(lp1); lp1.connect(rainGain); rainGain.connect(masterGain);
    src.start(); nodes.push(src);
    // 층2: 낮게 깔리는 빗소리 바닥
    const src2 = ctx.createBufferSource();
    src2.buffer = makeNoiseBuffer(ctx, 'brown');
    src2.loop = true;
    const lp2 = ctx.createBiquadFilter();
    lp2.type = 'lowpass'; lp2.frequency.value = 450;
    const baseGain = ctx.createGain(); baseGain.gain.value = 0.5;
    src2.connect(lp2); lp2.connect(baseGain); baseGain.connect(masterGain);
    src2.start(); nodes.push(src2);
    // 층3: 멀리서 톡톡 떨어지는 빗방울 (작고 은은하게)
    const drop = () => {
      if (!running) return;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      const f = 400 + Math.random() * 900;
      o.frequency.setValueAtTime(f, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(f * 0.6, ctx.currentTime + 0.05);
      g.gain.setValueAtTime(0, ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.025 + Math.random() * 0.025, ctx.currentTime + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.07);
      o.connect(g); g.connect(masterGain);
      o.start(); o.stop(ctx.currentTime + 0.09);
      bowlTimer = setTimeout(drop, 250 + Math.random() * 900);
    };
    drop();
  } else if (type === 'ocean' || type === 'wind') {
    const src = ctx.createBufferSource();
    src.buffer = makeNoiseBuffer(ctx, 'brown');
    src.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.Q.value = 0.5;
    const g = ctx.createGain(); g.gain.value = 0.7;
    src.connect(filter); filter.connect(g); g.connect(masterGain);
    if (type === 'ocean') {
      filter.frequency.value = 500;
      // 파도가 밀려오고 빠지는 느낌 (필터 + 음량 함께 출렁)
      const lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
      lfo.frequency.value = 0.09; lfoGain.gain.value = 280;
      lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
      const lfo2 = ctx.createOscillator(), lfoGain2 = ctx.createGain();
      lfo2.frequency.value = 0.09; lfoGain2.gain.value = 0.35;
      lfo2.connect(lfoGain2); lfoGain2.connect(g.gain);
      lfo.start(); lfo2.start(); nodes.push(lfo, lfo2);
    } else {
      filter.frequency.value = 700;
      const lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
      lfo.frequency.value = 0.18; lfoGain.gain.value = 320;
      lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
      lfo.start(); nodes.push(lfo);
    }
    src.start(); nodes.push(src);
  } else if (type === 'bowl') {
    const strike = () => {
      if (!running) return;
      [220, 330, 440, 587].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f * (1 + Math.random() * 0.004);
        g.gain.setValueAtTime(0, ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.15 / (i + 1), ctx.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 12);
        o.connect(g); g.connect(masterGain);
        o.start(); o.stop(ctx.currentTime + 12);
      });
      bowlTimer = setTimeout(strike, 15000 + Math.random() * 10000);
    };
    strike();
  } else if (type === 'drone') {
    [110, 110.5, 220, 165].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = i < 2 ? 'sine' : 'triangle';
      o.frequency.value = f;
      g.gain.value = i < 2 ? 0.18 : 0.05;
      o.connect(g); g.connect(masterGain);
      o.start(); nodes.push(o);
    });
  } else if (type === 'piano') {
    startGymnopedie();
  }
}

function stopSound() {
  if (silentEl) silentEl.pause();
  if (bowlTimer) { clearTimeout(bowlTimer); bowlTimer = null; }
  if (masterGain && ctx) {
    masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.5);
    const old = nodes; nodes = [];
    setTimeout(() => old.forEach(n => { try { n.stop(); } catch(e){} }), 1600);
  }
}

function chime() {
  // 종료 알림 종소리 3번
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  for (let k = 0; k < 3; k++) {
    const t = ctx.currentTime + k * 2.5;
    [523, 784, 1047].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.2 / (i + 1), t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 2.3);
    });
  }
}

// --- 타이머 ---
function fmt(s) {
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function render() {
  $('display').textContent = fmt(remainSec);
  $('progress').style.strokeDashoffset = CIRC * (remainSec / totalSec);
}
function start() {
  running = true;
  document.body.classList.add('playing');
  $('startBtn').textContent = '일시정지';
  $('status').textContent = '명상 중…';
  startSound(document.querySelector('#soundChips .active').dataset.sound);
  tickInterval = setInterval(() => {
    remainSec--;
    render();
    if (remainSec <= 0) finish();
  }, 1000);
}
function pause() {
  running = false;
  document.body.classList.remove('playing');
  clearInterval(tickInterval);
  stopSound();
  $('startBtn').textContent = '계속';
  $('status').textContent = '일시정지';
}
function finish() {
  pause();
  chime();
  $('startBtn').textContent = '시작';
  $('status').textContent = '명상 완료 🙏';
  saveSession(totalSec / 60, document.querySelector('#soundChips .active').textContent.trim());
  remainSec = totalSec;
  setTimeout(render, 100);
}
function reset() {
  pause();
  remainSec = totalSec;
  $('startBtn').textContent = '시작';
  $('status').textContent = '준비됨';
  render();
}

// --- 명상 기록 ---
function loadHistory() {
  try { return JSON.parse(localStorage.getItem('goyo-history')) || []; }
  catch (e) { return []; }
}
function saveSession(min, sound) {
  const h = loadHistory();
  h.unshift({ at: new Date().toISOString(), min, sound });
  localStorage.setItem('goyo-history', JSON.stringify(h.slice(0, 200)));
  renderHistory();
}
function calcStreak(h) {
  const days = new Set(h.map(r => r.at.slice(0, 10)));
  let streak = 0;
  const d = new Date();
  // 오늘 안 했어도 어제까지 이어졌으면 연속으로 인정
  if (!days.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1);
  while (days.has(d.toISOString().slice(0, 10))) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}
function renderHistory() {
  const h = loadHistory();
  $('statTotal').textContent = h.reduce((s, r) => s + r.min, 0);
  $('statCount').textContent = h.length;
  $('statStreak').textContent = calcStreak(h);
  const list = $('historyList');
  if (!h.length) {
    list.innerHTML = '<div class="empty-history">아직 기록이 없어요. 첫 명상을 시작해 보세요 🌱</div>';
    return;
  }
  list.innerHTML = h.slice(0, 7).map(r => {
    const d = new Date(r.at);
    const when = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    return '<div class="history-item"><span>' + r.sound + ' · ' + r.min + '분</span><span class="when">' + when + '</span></div>';
  }).join('');
}

$('startBtn').onclick = () => running ? pause() : start();
$('resetBtn').onclick = reset;
$('volume').oninput = e => {
  if (masterGain) masterGain.gain.linearRampToValueAtTime(e.target.value / 100, ctx.currentTime + 0.1);
};

document.querySelectorAll('#timeChips .chip').forEach(c => c.onclick = () => {
  document.querySelector('#timeChips .active').classList.remove('active');
  c.classList.add('active');
  totalSec = remainSec = c.dataset.min * 60;
  if (running) pause();
  $('startBtn').textContent = '시작';
  $('status').textContent = '준비됨';
  render();
});
document.querySelectorAll('#soundChips .chip').forEach(c => c.onclick = () => {
  document.querySelector('#soundChips .active').classList.remove('active');
  c.classList.add('active');
  if (running) { stopSound(); startSound(c.dataset.sound); }
});

render();
renderHistory();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js');
}
</script>
